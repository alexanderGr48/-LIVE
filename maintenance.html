
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>TAS LIVE - Temporarily Offline</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: clamp(48px, 12vw, 80px);
      margin: 0 0 25px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .status {
      display: inline-block;
      color: #ff4545;
      border: 1px solid #ff4545;
      border-radius: 30px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    p {
      color: #999;
      line-height: 1.7;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>TAS LIVE</h1>

    <div class="status">
      TEMPORARILY OFFLINE
    </div>

    <h2>We'll be back soon!</h2>

    <p>
      TAS LIVE is temporarily unavailable.
      We're looking forward to seeing you again soon.
    </p>
  </main>
</body>
</html>
