
name: Check TikTok LIVE

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker
        run: pip install TikTokLive

      - name: Check TikTok status
        run: |
          python - <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from TikTokLive import TikTokLiveClient

          async def main():
              client = TikTokLiveClient(unique_id="tasosanastasios")
              live = bool(await client.is_live())

              path = Path("status.json")

              if path.exists():
                  try:
                      previous = json.loads(path.read_text())
                  except Exception:
                      previous = {}
              else:
                  previous = {}

              last_ended = previous.get("last_stream_ended")

              if previous.get("live") is True and not live:
                  last_ended = datetime.now(timezone.utc).isoformat()

              data = {
                  "live": live,
                  "username": "tasosanastasios",
                  "last_stream_ended": last_ended
              }

              path.write_text(json.dumps(data, indent=2))

          asyncio.run(main())
          PY

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update LIVE status"
          git push
