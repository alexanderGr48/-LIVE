
name: Check TikTok LIVE

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checker
        run: pip install TikTokLive

      - name: Check TikTok status
        run: |
          python - <<'PY'
          import asyncio
          import json
          from TikTokLive import TikTokLiveClient

          async def main():
              client = TikTokLiveClient(unique_id="tasosanastasios")
              live = await client.is_live()
              with open("status.json", "w") as f:
                  json.dump({
                      "live": bool(live),
                      "username": "tasosanastasios"
                  }, f)

          asyncio.run(main())
          PY

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet || git commit -m "Update LIVE status"
          git push
