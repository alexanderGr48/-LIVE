
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

main {
  padding: 25px;
  width: 100%;
}

h1 {
  font-size: clamp(55px, 12vw, 130px);
  letter-spacing: 8px;
  margin: 0 0 25px;
}

#status {
  font-size: clamp(32px, 7vw, 65px);
  font-weight: bold;
  margin: 25px 0;
}

#status.live {
  color: #20e879;
}

#status.offline {
  color: #ff4545;
}

p {
  color: #ccc;
  font-size: clamp(18px, 3vw, 26px);
}

a {
  display: inline-block;
  margin-top: 25px;
  padding: 24px 35px;
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(20px, 4vw, 36px);
  font-weight: bold;
  border-radius: 12px;
}
</style>
</head>

<body>
<main>
  <h1>TAS LIVE</h1>

  <div id="status">CHECKING...</div>

  <p id="message">Checking TikTok status...</p>

  <p id="lastEnded"></p>

  <a id="watchButton"
     href="https://www.tiktok.com/@tasosanastasios">
    VISIT TAS CHANNEL
  </a>
</main>

<script>
const liveLink =
  "https://www.tiktok.com/@tasosanastasios/live";

const channelLink =
  "https://www.tiktok.com/@tasosanastasios";

async function checkStatus() {
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const lastEnded = document.getElementById("lastEnded");
  const button = document.getElementById("watchButton");

  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("Status unavailable");
    }

    const data = await response.json();

    if (data.live === true) {
      status.textContent = "● LIVE NOW";
      status.className = "live";

      message.textContent = "TAS IS LIVE ON TIKTOK!";

      button.textContent = "WATCH TAS LIVE";
      button.href = liveLink;

      lastEnded.textContent = "";
    } else {
      status.textContent = "● OFFLINE";
      status.className = "offline";

      message.textContent = "TAS IS NOT LIVE RIGHT NOW.";

      button.textContent = "VISIT TAS CHANNEL";
      button.href = channelLink;

      if (data.last_stream_ended) {
        const date = new Date(data.last_stream_ended);

        lastEnded.textContent =
          "LAST STREAM ENDED: " +
          date.toLocaleString();
      } else {
        lastEnded.textContent =
          "LAST STREAM ENDED: NOT AVAILABLE YET";
      }
    }
  } catch (error) {
    status.textContent = "STATUS UNAVAILABLE";
    status.className = "";

    message.textContent =
      "Could not check TikTok status.";

    lastEnded.textContent = "";

    button.textContent = "VISIT TAS CHANNEL";
    button.href = channelLink;
  }
}

checkStatus();
setInterval(checkStatus, 300000);
</script>
</body>
</html>
