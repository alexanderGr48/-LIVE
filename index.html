
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAS LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:white;font-family:Arial,sans-serif;text-align:center}
button{cursor:pointer;font-weight:bold}
#home{padding:28px 12px 90px}
h1{font-size:clamp(48px,10vw,90px);margin:25px 0 12px;letter-spacing:3px}
#status{font-size:clamp(26px,5vw,48px);font-weight:bold;margin:20px}
#message{color:#aaa;font-size:15px}
.mainbtn{display:block;margin:14px auto;width:min(280px,85%);padding:17px;border:0;border-radius:10px;background:#222;color:white;font-size:22px}
.mainbtn:hover{background:#444}
#tiktok{background:#e90045}
#gameScreen{display:none;position:fixed;inset:0;background:#080b12;z-index:5;overflow:hidden}
#gameTop{height:48px;display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:#10141d}
#gameTitle{font-weight:bold;letter-spacing:2px}
#closeGame{background:#333;color:white;border:0;border-radius:7px;padding:9px 14px}
#gameCanvas{display:block;width:100%;height:calc(100% - 135px);background:#101827;touch-action:none}
#gameHud{position:absolute;top:58px;left:10px;right:10px;display:flex;justify-content:space-between;gap:12px;pointer-events:none;text-align:left}
.hudBox{width:min(230px,42%);background:#111c;padding:8px;border:1px solid #ffffff33;border-radius:8px}
.hudLabel{font-size:12px;margin-bottom:5px}
.bar{height:12px;background:#3b2020;border-radius:10px;overflow:hidden}
.barFill{height:100%;width:100%;background:#35c75b;transition:width .15s}
#bossHud{display:none}
#bossFill{background:#e64b42}
#gameMessage{position:absolute;top:22%;left:10%;right:10%;font-size:clamp(18px,3vw,28px);font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none}
#controls{height:87px;display:flex;justify-content:center;align-items:center;gap:18px;background:#10141d}
.control{width:76px;height:62px;border:1px solid #777;border-radius:14px;background:#292f3a;color:white;font-size:17px;touch-action:none}
.control:active{background:#59677b}
#shopPanel{display:none;position:fixed;z-index:9;inset:8% 5%;background:#171b24;border:2px solid #9d814d;border-radius:14px;padding:18px;overflow:auto}
.shopItem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#252b37;margin:10px 0;padding:12px;border-radius:8px}
.shopItem button{background:#9d814d;color:white;border:0;padding:9px 13px;border-radius:7px}
#closeShop{background:#555;color:white;border:0;padding:10px 18px;border-radius:7px}
#gallery{display:none;position:fixed;inset:0;background:#000;z-index:4;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr;gap:0}
#gallery img{width:100%;height:100%;object-fit:contain}
#galleryBack{position:fixed;z-index:6;top:10px;left:10px;background:#222;color:white;border:0;border-radius:8px;padding:12px;display:none}
#lock{position:fixed;right:18px;bottom:18px;width:68px;height:68px;border-radius:50%;border:3px solid white;background:#d50000;color:white;font-size:15px;z-index:10}
#lock:disabled{opacity:.45}
@media(max-width:650px){
 #gallery{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
 #gameCanvas{height:calc(100% - 135px)}
 .control{width:28%;max-width:110px}
}
</style>
</head>
<body>

<main id="home">
  <h1>TAS LIVE</h1>
  <div id="status">CHECKING...</div>
  <div id="message">Live status updates automatically</div>
  <p id="lastEnded"></p>

  <button class="mainbtn" onclick="openGame()">GAMES</button>
  <button class="mainbtn" onclick="openGallery()">PICS</button>
  <button class="mainbtn" id="tiktok" onclick="window.open('https://www.tiktok.com/@tasosanastasios','_blank')">OPEN TIKTOK</button>
  <button class="mainbtn" onclick="openShop()">ITEM SHOP</button>
</main>

<div id="gallery"></div>
<button id="galleryBack" onclick="closeGallery()">BACK</button>

<div id="gameScreen">
  <div id="gameTop">
    <span id="gameTitle">THE CASTLE QUEST</span>
    <span id="gemCount">💎 0</span>
    <button id="closeGame" onclick="closeGame()">EXIT</button>
  </div>
  <div id="gameHud">
    <div class="hudBox">
      <div class="hudLabel">YOUR HEALTH</div>
      <div class="bar"><div class="barFill" id="playerFill"></div></div>
    </div>
    <div class="hudBox" id="bossHud">
      <div class="hudLabel">CASTLE GUARDIAN</div>
      <div class="bar"><div class="barFill" id="bossFill"></div></div>
    </div>
  </div>
  <div id="gameMessage">Reach the castle gate!</div>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">
    <button class="control" id="leftBtn">LEFT</button>
    <button class="control" id="jumpBtn">JUMP</button>
    <button class="control" id="rightBtn">RIGHT</button>
  </div>
</div>

<div id="shopPanel">
  <h2>⚒️ ITEM SHOP</h2>
  <p>Gems: <strong id="shopGems">0</strong></p>
  <p>Spend your victory gems on character styles.</p>
  <div id="shopItems"></div>
  <button id="closeShop" onclick="closeShop()">CLOSE</button>
</div>

<button id="lock" disabled>LOCK</button>

<script>
/* WEBSITE STATUS */
const statusEl=document.getElementById('status');
async function checkStatus(){
  try{
    const r=await fetch('/status.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Status unavailable');
    const d=await r.json();
    if(d.live===true){
      statusEl.textContent='🔴 LIVE NOW';
      statusEl.style.color='#ff3030';
    }else{
      statusEl.textContent='⚫ OFFLINE';
      statusEl.style.color='#aaa';
    }
    const last=document.getElementById('lastEnded');
    last.textContent=d.last_stream_ended
      ? 'Last stream ended: '+new Date(d.last_stream_ended).toLocaleString()
      : '';
  }catch(e){
    statusEl.textContent='⚫ OFFLINE';
    statusEl.style.color='#aaa';
  }
}
checkStatus();
setInterval(checkStatus,5000);

/* PICS GALLERY */
async function openGallery(){
  const gallery=document.getElementById('gallery');
  gallery.style.display='grid';
  document.getElementById('galleryBack').style.display='block';
  gallery.innerHTML='<p style="grid-column:1/-1">Loading pictures...</p>';
  try{
    const r=await fetch('https://api.github.com/repos/alexanderGr48/-LIVE/contents/pics');
    if(!r.ok)throw new Error('Could not load pictures');
    const files=await r.json();
    const pics=files.filter(f=>/\.(jpg|jpeg|png|gif|webp)$/i.test(f.name))
      .sort((a,b)=>a.name.localeCompare(b.name)).slice(0,3);
    gallery.innerHTML='';
    if(!pics.length)gallery.innerHTML='<p>No pictures found in the pics folder.</p>';
    pics.forEach(f=>{
      const img=document.createElement('img');
      img.src=f.download_url;
      img.alt=f.name;
      gallery.appendChild(img);
    });
  }catch(e){
    gallery.innerHTML='<p>Could not load pictures. Check the pics folder in GitHub.</p>';
  }
}
function closeGallery(){
  document.getElementById('gallery').style.display='none';
  document.getElementById('galleryBack').style.display='none';
}

/* LOCK SYSTEM */
const youtubeDestination='https://youtube.com/shorts/Yt_F2odTgPA?si=d0U5hcmywHO6cpaO';
const lockButton=document.getElementById('lock');
let banReady=false;
async function checkBan(){
  try{
    const r=await fetch('/api/ban',{cache:'no-store'});
    if(!r.ok)throw new Error();
    const d=await r.json();
    if(d.banned)window.location.replace(youtubeDestination);
    banReady=true;
    lockButton.disabled=false;
  }catch(e){
    lockButton.disabled=true;
  }
}
checkBan();
lockButton.addEventListener('click',async()=>{
  if(!banReady)return;
  lockButton.disabled=true;
  try{
    await fetch('/api/ban',{method:'POST',cache:'no-store'});
    window.location.replace(youtubeDestination);
  }catch(e){
    lockButton.disabled=false;
    alert('Could not activate the lock. Please try again.');
  }
});

/* GAME */
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const gameScreen=document.getElementById('gameScreen');
const messageEl=document.getElementById('gameMessage');
let running=false,lastTime=0,scene='castle',camera=0;
let keys={left:false,right:false};
let player,boss,platforms,switches,gate,portal;
let elapsed=0,attackCooldown=0,damageCooldown=0,gameWon=false;
let gems=Number(localStorage.getItem('tasGems')||0);
let owned=JSON.parse(localStorage.getItem('tasOwned')||'["default"]');
let equipped=localStorage.getItem('tasEquipped')||'default';

const skins={
 default:{name:'Knight Silver',price:0,color:'#d9dce4'},
 gold:{name:'Golden Knight',price:25,color:'#e9b943'},
 blue:{name:'Royal Blue',price:35,color:'#4d8ce2'},
 emerald:{name:'Emerald Knight',price:40,color:'#35bd83'},
 shadow:{name:'Shadow Knight',price:50,color:'#55536e'}
};

function resizeCanvas(){
  const rect=canvas.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(rect.width*dpr));
  canvas.height=Math.max(1,Math.floor(rect.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resizeCanvas);

function openGame(){
  closeGallery();
  gameScreen.style.display='block';
  resizeCanvas();
  startGame();
}
function closeGame(){
  running=false;
  gameScreen.style.display='none';
}
function updateGemDisplay(){
  document.getElementById('gemCount').textContent='💎 '+gems;
}

function startGame(){
  scene='castle';camera=0;elapsed=0;gameWon=false;
  player={x:70,y:0,vx:0,vy:0,w:34,h:42,hp:100,onGround:false,facing:1,invuln:0};
  boss={x:0,y:0,hp:100,maxHp:100,attackTimer:2};
  platforms=[
    {x:0,y:430,w:420,h:90},{x:490,y:390,w:190,h:35},
    {x:740,y:350,w:190,h:35},{x:990,y:410,w:180,h:35},
    {x:1220,y:350,w:200,h:35},{x:1480,y:410,w:190,h:35},
    {x:1740,y:360,w:210,h:35},{x:2010,y:420,w:240,h:35},
    {x:2280,y:380,w:330,h:100}
  ];
  switches=[{x:830,y:320,on:false},{x:1570,y:380,on:false}];
  gate={x:1880,open:false};
  portal={x:2450,y:300};
  attackCooldown=0;damageCooldown=0;
  document.getElementById('bossHud').style.display='none';
  setMessage('Cross the broken castle bridges. Find both switches!');
  updateGemDisplay();
  running=true;
  lastTime=performance.now();
  requestAnimationFrame(loop);
}
function setMessage(t){messageEl.textContent=t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function loop(now){
  if(!running)return;
  const dt=Math.min((now-lastTime)/1000,.035);
  lastTime=now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt){
  elapsed+=dt;
  attackCooldown=Math.max(0,attackCooldown-dt);
  damageCooldown=Math.max(0,damageCooldown-dt);
  player.invuln=Math.max(0,player.invuln-dt);

  const speed=scene==='castle'?225:205;
  player.vx=(keys.right?speed:0)-(keys.left?speed:0);
  if(player.vx)player.facing=player.vx>0?1:-1;
  player.x+=player.vx*dt;
  player.vy+=1050*dt;
  player.y+=player.vy*dt;
  player.onGround=false;

  if(scene==='castle'){
    for(const p of platforms){
      if(player.x+player.w>p.x&&player.x<p.x+p.w&&
        player.y+player.h>=p.y&&player.y+player.h<=p.y+28&&player.vy>=0){
        player.y=p.y-player.h;player.vy=0;player.onGround=true;
      }
    }
    if(player.y>700){
      player.hp-=18;
      player.x=Math.max(50,player.x-100);
      player.y=250;player.vy=0;
      setMessage('Careful! You fell. Keep going!');
      updateBars();
    }
    for(const s of switches){
      if(!s.on&&Math.abs((player.x+player.w/2)-s.x)<42&&Math.abs(player.y-s.y)<65){
        s.on=true;
        setMessage('Switch activated!');
      }
    }
    gate.open=switches.every(s=>s.on);
    if(player.x>gate.x&&!gate.open)player.x=gate.x-player.w;
    if(gate.open&&player.x>portal.x-25){
      scene='portal';
      setMessage('The portal opens...');
      setTimeout(()=>{
        if(running&&scene==='portal'){
          scene='boss';camera=0;
          player.x=120;player.y=300;player.vy=0;
          boss={x:790,y:0,hp:100,maxHp:100,attackTimer:2};
          document.getElementById('bossHud').style.display='block';
          setMessage('THE CASTLE GUARDIAN! Jump over its ground waves!');
        }
      },1100);
    }
  }else if(scene==='boss'){
    const floor=canvas.clientHeight-105;
    if(player.y+player.h>=floor){
      player.y=floor-player.h;player.vy=0;player.onGround=true;
    }
    if(player.x<20)player.x=20;
    if(player.x>canvas.clientWidth-60)player.x=canvas.clientWidth-60;

    boss.attackTimer-=dt;
    if(boss.attackTimer<=0){
      boss.attackTimer=2.5;
      boss.wave=true;
      boss.waveTimer=.8;
    }
    if(boss.waveTimer>0){
      boss.waveTimer-=dt;
      if(boss.waveTimer<=0)boss.wave=false;
    }
    const close=Math.abs((player.x+player.w/2)-(boss.x+55))<125;
    if(close&&attackCooldown<=0){
      boss.hp=Math.max(0,boss.hp-9);
      attackCooldown=.72;
      setMessage('Your sword strikes the guardian!');
      updateBars();
    }
    if(boss.wave&&player.onGround&&damageCooldown<=0&&Math.abs(player.x-boss.x)<240){
      player.hp-=12;damageCooldown=1.2;
      setMessage('Jump over the guardian’s ground wave!');
      updateBars();
    }
    if(boss.hp<=0&&!gameWon){
      gameWon=true;gems+=50;
      localStorage.setItem('tasGems',String(gems));
      updateGemDisplay();
      setMessage('VICTORY! You earned 50 gems!');
      scene='victory';
      document.getElementById('bossHud').style.display='none';
    }
  }

  if(player.hp<=0){
    player.hp=100;player.x=scene==='boss'?100:70;player.y=200;player.vy=0;
    if(scene==='boss')boss.hp=Math.min(100,boss.hp+12);
    setMessage('You recovered. Try again!');
  }
  camera=scene==='castle'?clamp(player.x-canvas.clientWidth*.35,0,2700):0;
  updateBars();
}
function updateBars(){
  document.getElementById('playerFill').style.width=clamp(player.hp,0,100)+'%';
  document.getElementById('bossFill').style.width=(boss.hp/boss.maxHp*100)+'%';
}

/* DRAWING */
function draw(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(scene==='castle'||scene==='portal')drawCastle(w,h);
  else drawArena(w,h);
  if(scene!=='victory')drawPlayer(w,h);
  if(scene==='boss'||scene==='victory')drawBoss(w,h);
  if(scene==='victory'){
    ctx.fillStyle='#ffffff';ctx.textAlign='center';
    ctx.font='bold 32px Arial';ctx.fillText('CASTLE CLEARED!',w/2,h/2-10);
    ctx.font='20px Arial';ctx.fillText('+50 GEMS',w/2,h/2+30);
    ctx.font='15px Arial';ctx.fillText('Exit the game to return to the website',w/2,h/2+65);
  }
}
function drawCastle(w,h){
  const sky=ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#182a46');sky.addColorStop(1,'#b17b53');
  ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#26364a';
  for(let i=0;i<8;i++){
    let x=((i*300-camera*.25)%1600+1600)%1600;
    ctx.fillRect(x,100,110,260);
    ctx.fillRect(x-18,80,146,25);
    for(let j=0;j<4;j++)ctx.fillRect(x+12+j*27,50,14,55);
  }
  ctx.fillStyle='#18212b';
  ctx.fillRect(0,h-85,w,85);
  for(const p of platforms){
    const x=p.x-camera;
    if(x+p.w<0||x>w)continue;
    ctx.fillStyle='#6c6259';ctx.fillRect(x,p.y,p.w,p.h);
    ctx.fillStyle='#a99b87';ctx.fillRect(x,p.y,p.w,8);
    ctx.strokeStyle='#403c39';ctx.lineWidth=2;
    for(let bx=x+20;bx<x+p.w-10;bx+=55){
      ctx.beginPath();ctx.moveTo(bx,p.y+8);ctx.lineTo(bx+8,p.y+p.h);ctx.stroke();
    }
  }
  switches.forEach(s=>{
    const x=s.x-camera;
    ctx.fillStyle=s.on?'#4bff8b':'#e2b64e';
    ctx.beginPath();ctx.arc(x,s.y,13,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(x-3,s.y-24,6,12);
  });
  const gx=gate.x-camera;
  ctx.fillStyle=gate.open?'#2a9b63':'#76553d';
  ctx.fillRect(gx,h-190,22,105);
  if(!gate.open){
    ctx.strokeStyle='#d3b37a';ctx.lineWidth=5;
    for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(gx+i*7,h-190);ctx.lineTo(gx+i*7,h-85);ctx.stroke();}
  }
  const px=portal.x-camera;
  ctx.save();ctx.translate(px,h-155);
  ctx.shadowBlur=25;ctx.shadowColor='#55d9ff';
  ctx.strokeStyle='#6ee7ff';ctx.lineWidth=8;
  ctx.beginPath();ctx.ellipse(0,0,30,60,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#54bce755';ctx.beginPath();ctx.ellipse(0,0,23,53,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.fillText('PORTAL',px-25,h-225);
}
function drawArena(w,h){
  const sky=ctx.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#171326');sky.addColorStop(1,'#573a35');
  ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#302a38';
  for(let i=0;i<8;i++){
    const x=i*w/7;
    ctx.fillRect(x,65,45,h-170);
    ctx.fillStyle='#544454';ctx.fillRect(x-10,55,65,14);
    ctx.fillStyle='#302a38';
  }
  ctx.fillStyle='#645044';ctx.fillRect(0,h-105,w,105);
  ctx.fillStyle='#9a8065';ctx.fillRect(0,h-105,w,8);
  for(let i=0;i<12;i++){
    ctx.fillStyle='#4a3d39';ctx.fillRect(i*w/12,h-95,2,90);
  }
  // Giant glowing windows
  for(let i=0;i<3;i++){
    ctx.fillStyle='#d89a4a33';
    ctx.beginPath();ctx.arc(w*(.2+i*.3),170,42,Math.PI,0);ctx.lineTo(w*(.2+i*.3)+42,260);ctx.lineTo(w*(.2+i*.3)-42,260);ctx.fill();
  }
  if(boss.wave){
    ctx.fillStyle='#e2a34a88';
    ctx.fillRect(0,h-120,w,15);
  }
}
function drawPlayer(w,h){
  const x=player.x-camera,y=player.y;
  ctx.save();
  if(player.invuln>0&&Math.floor(performance.now()/90)%2===0)ctx.globalAlpha=.45;
  // legs
  ctx.fillStyle='#353d4b';
  ctx.fillRect(x+7,y+29,8,13);ctx.fillRect(x+21,y+29,8,13);
  // ball body
  const skin=skins[equipped]||skins.default;
  const grad=ctx.createRadialGradient(x+12,y+10,2,x+17,y+19,23);
  grad.addColorStop(0,'#fff');grad.addColorStop(.25,skin.color);grad.addColorStop(1,'#454b5a');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x+17,y+19,18,0,Math.PI*2);ctx.fill();
  // face
  ctx.fillStyle='#171717';
  ctx.beginPath();ctx.arc(x+11,y+17,2,0,Math.PI*2);ctx.arc(x+23,y+17,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#171717';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x+17,y+22,5,.15,Math.PI-.15);ctx.stroke();
  // sword visibly held
  ctx.save();ctx.translate(x+17,y+22);ctx.scale(player.facing,1);
  ctx.strokeStyle='#8b929e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(10,3);ctx.lineTo(35,-18);ctx.stroke();
  ctx.strokeStyle='#e5edf7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,1);ctx.lineTo(36,-18);ctx.stroke();
  ctx.strokeStyle='#8d633c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,5);ctx.lineTo(15,12);ctx.stroke();
  ctx.restore();ctx.restore();
}
function drawBoss(w,h){
  const floor=h-105;
  const x=scene==='castle'?0:boss.x;
  if(scene==='castle')return;
  // Large armored guardian
  ctx.save();
  ctx.fillStyle='#292d3a';
  ctx.fillRect(x+12,floor-100,86,95);
  ctx.fillStyle='#545c6d';
  ctx.beginPath();ctx.arc(x+55,floor-122,48,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#858d9b';
  ctx.beginPath();ctx.arc(x+55,floor-122,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff594c';
  ctx.fillRect(x+31,floor-133,13,7);ctx.fillRect(x+66,floor-133,13,7);
  ctx.fillStyle='#303745';ctx.fillRect(x+5,floor-55,100,18);
  ctx.fillStyle='#a6adba';ctx.fillRect(x+35,floor-175,40,12);
  // guardian sword
  ctx.strokeStyle='#c8d2df';ctx.lineWidth=9;
  ctx.beginPath();ctx.moveTo(x+100,floor-60);ctx.lineTo(x+145,floor-155);ctx.stroke();
  ctx.restore();
}

/* CONTROLS */
function jump(){
  if(running&&player.onGround&&scene!=='victory'){
    player.vy=-465;player.onGround=false;
  }
}
function bindHold(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));
}
bindHold('leftBtn','left');bindHold('rightBtn','right');
document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();jump();});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;
  if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w'){e.preventDefault();jump();}
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;
});

/* SHOP */
function openShop(){
  const panel=document.getElementById('shopPanel');
  panel.style.display='block';
  document.getElementById('shopGems').textContent=gems;
  const list=document.getElementById('shopItems');
  list.innerHTML='';
  Object.entries(skins).forEach(([id,item])=>{
    const row=document.createElement('div');row.className='shopItem';
    const info=document.createElement('span');
    info.textContent=item.name+' — '+(item.price===0?'FREE':item.price+' gems');
    const btn=document.createElement('button');
    if(owned.includes(id)){
      btn.textContent=equipped===id?'EQUIPPED':'EQUIP';
      btn.onclick=()=>{
        equipped=id;localStorage.setItem('tasEquipped',id);openShop();
      };
    }else{
      btn.textContent='BUY';
      btn.onclick=()=>{
        if(gems<item.price){alert('Not enough gems yet!');return;}
        gems-=item.price;owned.push(id);
        localStorage.setItem('tasGems',String(gems));
        localStorage.setItem('tasOwned',JSON.stringify(owned));
        openShop();updateGemDisplay();
      };
    }
    row.append(info,btn);list.appendChild(row);
  });
}
function closeShop(){document.getElementById('shopPanel').style.display='none';}
updateGemDisplay();
</script>
