
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* MAIN SCREEN */
#home {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  padding:
    max(16px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(90px, calc(30px + env(safe-area-inset-bottom)))
    max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#picsButton {
  margin-bottom: clamp(20px, 4vh, 35px);
  padding: 12px 38px;
  background: transparent;
  border: 2px solid white;
  color: white;
  border-radius: 10px;
  font-size: clamp(18px, 2.5vw, 25px);
  font-weight: bold;
  cursor: pointer;
}

h1 {
  font-size: clamp(42px, 12vw, 130px);
  letter-spacing: clamp(2px, 1vw, 8px);
  margin: 0 0 20px;
  overflow-wrap: anywhere;
}

#status {
  font-size: clamp(30px, 7vw, 65px);
  font-weight: bold;
  margin: 20px 0;
}

.live {
  color: #20e879;
}

.offline {
  color: #ff4545;
}

p {
  color: #ccc;
  font-size: clamp(16px, 3vw, 26px);
  max-width: 90vw;
  overflow-wrap: anywhere;
}

#watchButton {
  display: inline-block;
  margin-top: 20px;
  padding: clamp(15px, 3vw, 22px) clamp(20px, 4vw, 30px);
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(18px, 4vw, 36px);
  font-weight: bold;
  border-radius: 12px;
  max-width: 95%;
}

/* GALLERY */
#gallery {
  display: none;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  position: fixed;
  inset: 0;
  background: black;
}

#photoGrid {
  height: 100%;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: 1fr;
  gap: 2px;
  background: black;
}

#photoGrid img {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  object-fit: contain;
  display: block;
  background: black;
}

#closeGallery {
  position: absolute;
  z-index: 2;
  top: max(10px, env(safe-area-inset-top));
  left: max(10px, env(safe-area-inset-left));
  padding: 10px 16px;
  background: rgba(0,0,0,.75);
  border: 1px solid white;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#galleryMessage {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  color: white;
  pointer-events: none;
}

/* LOCK BUTTON */
#lockButton {
  position: fixed;
  z-index: 20;
  right: max(18px, env(safe-area-inset-right));
  bottom: max(18px, env(safe-area-inset-bottom));
  width: clamp(58px, 8vw, 72px);
  height: clamp(58px, 8vw, 72px);
  border: none;
  border-radius: 50%;
  background: red;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,0,0,.5);
}

#lockButton:disabled {
  opacity: .5;
  cursor: wait;
}

/* SMALL SCREENS */
@media (max-width: 600px) {
  #home {
    padding-left: 12px;
    padding-right: 12px;
  }

  h1 {
    letter-spacing: 3px;
  }

  #photoGrid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  #closeGallery {
    font-size: 14px;
    padding: 9px 12px;
  }
}

/* LANDSCAPE PHONES AND TABLETS */
@media (max-height: 500px) and (orientation: landscape) {
  #home {
    padding-top: 8px;
    padding-bottom: 80px;
  }

  #picsButton {
    margin-bottom: 8px;
    padding: 7px 25px;
  }

  h1 {
    font-size: clamp(35px, 9vh, 75px);
    margin-bottom: 5px;
  }

  #status {
    font-size: clamp(25px, 8vh, 45px);
    margin: 8px 0;
  }

  p {
    margin: 6px;
    font-size: clamp(14px, 3vh, 19px);
  }

  #watchButton {
    margin-top: 8px;
    padding: 10px 18px;
    font-size: 18px;
  }
}

/* LARGE PROJECTORS AND TV SCREENS */
@media (min-width: 1400px) {
  #home {
    padding: 40px;
  }

  #picsButton {
    font-size: 30px;
    padding: 16px 48px;
  }

  h1 {
    font-size: clamp(110px, 12vw, 180px);
  }

  #status {
    font-size: clamp(65px, 7vw, 95px);
  }

  p {
    font-size: clamp(25px, 2vw, 34px);
  }
}
</style>
</head>

<body>

<main id="home">
  <button id="picsButton" onclick="openGallery()">PICS</button>

  <h1>TAS LIVE</h1>

  <div id="status">CHECKING...</div>

  <p id="message">Checking TikTok status...</p>

  <p id="lastEnded"></p>

  <a id="watchButton"
     href="https://www.tiktok.com/@tasosanastasios">
    VISIT TAS CHANNEL
  </a>
</main>

<section id="gallery">
  <button id="closeGallery" onclick="closeGallery()">← BACK</button>

  <div id="photoGrid"></div>

  <p id="galleryMessage">Loading photos...</p>
</section>

<button id="lockButton" onclick="activateLock()" disabled>
  LOCK
</button>

<script>
const liveLink =
  "https://www.tiktok.com/@tasosanastasios/live";

const channelLink =
  "https://www.tiktok.com/@tasosanastasios";

const youtubeDestination =
  "https://youtube.com/shorts/Yt_F2odTgPA?si=d0U5hcmywHO6cpaO";

const picsURL =
  "https://api.github.com/repos/alexanderGr48/-LIVE/contents/pics";

let banReady = false;

/* CHECK BAN */
async function checkBan() {
  const button = document.getElementById("lockButton");

  try {
    const response = await fetch("/api/ban", {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    const data = await response.json();

    if (data.banned) {
      window.location.replace(youtubeDestination);
      return false;
    }

    banReady = true;
    button.disabled = false;
    return true;

  } catch (error) {
    banReady = false;
    button.disabled = true;
    return true;
  }
}

/* ACTIVATE BAN */
async function activateLock() {
  if (!banReady) return;

  const button = document.getElementById("lockButton");
  button.disabled = true;

  try {
    const response = await fetch("/api/ban", {
      method: "POST",
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    window.location.replace(youtubeDestination);

  } catch (error) {
    button.disabled = false;
    alert("Could not activate the ban. Please try again.");
  }
}

/* CHECK TIKTOK STATUS */
async function checkStatus() {
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const lastEnded = document.getElementById("lastEnded");
  const button = document.getElementById("watchButton");

  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error();

    const data = await response.json();

    if (data.live === true) {
      status.textContent = "● LIVE NOW";
      status.className = "live";
      message.textContent = "TAS IS LIVE ON TIKTOK!";
      button.textContent = "WATCH TAS LIVE";
      button.href = liveLink;
      lastEnded.textContent = "";

    } else {
      status.textContent = "● OFFLINE";
      status.className = "offline";
      message.textContent = "TAS IS NOT LIVE RIGHT NOW.";
      button.textContent = "VISIT TAS CHANNEL";
      button.href = channelLink;

      lastEnded.textContent = data.last_stream_ended
        ? "LAST STREAM ENDED: " +
          new Date(data.last_stream_ended).toLocaleString()
        : "LAST STREAM ENDED: NOT AVAILABLE YET";
    }

  } catch (error) {
    status.textContent = "STATUS UNAVAILABLE";
    status.className = "";
    message.textContent = "Could not check TikTok status.";
  }
}

/* OPEN GALLERY */
async function openGallery() {
  document.getElementById("home").style.display = "none";
  document.getElementById("gallery").style.display = "block";

  const grid = document.getElementById("photoGrid");
  const message = document.getElementById("galleryMessage");

  grid.innerHTML = "";
  message.textContent = "Loading photos...";

  try {
    const response = await fetch(picsURL);

    if (!response.ok) throw new Error();

    const files = await response.json();

    const photos = files
      .filter(file =>
        file.type === "file" &&
        /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name))
      .slice(0, 3);

    if (photos.length === 0) {
      message.textContent = "No photos uploaded yet.";
      return;
    }

    photos.forEach(file => {
      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = "TAS photo";
      grid.appendChild(img);
    });

    message.textContent = "";

  } catch (error) {
    message.textContent = "Could not load photos.";
  }
}

/* CLOSE GALLERY */
function closeGallery() {
  document.getElementById("gallery").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

/* START */
async function startWebsite() {
  const allowed = await checkBan();

  if (!allowed) return;

  await checkStatus();

  setInterval(checkStatus, 300000);
}

startWebsite();
</script>

</body>
</html>
