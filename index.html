
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

body {
  overflow: hidden;
}

/* HOME SCREEN */
#home {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: 8px 20px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* PICS BUTTON - MOVED HIGHER */
#picsButton {
  margin-bottom: 35px;
  transform: translateY(-50px);
  padding: 12px 38px;
  background: transparent;
  border: 2px solid white;
  color: white;
  border-radius: 10px;
  font-size: 25px;
  font-weight: bold;
}

h1 {
  font-size: clamp(55px, 12vw, 130px);
  letter-spacing: 8px;
  margin: 0 0 20px;
}

#status {
  font-size: clamp(32px, 7vw, 65px);
  font-weight: bold;
  margin: 20px 0;
}

.live {
  color: #20e879;
}

.offline {
  color: #ff4545;
}

p {
  color: #ccc;
  font-size: clamp(18px, 3vw, 26px);
}

#watchButton {
  display: inline-block;
  margin-top: 20px;
  padding: 22px 30px;
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(20px, 4vw, 36px);
  font-weight: bold;
  border-radius: 12px;
}

/* FULL SCREEN GALLERY */
#gallery {
  display: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: black;
}

#photoGrid {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
  background: black;
}

#photoGrid img,
#photoGrid .redPanel {
  display: block;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  object-fit: cover;
}

#photoGrid .redPanel {
  background:
    radial-gradient(ellipse at 50% 50%, #ff1717 0%, #9c0000 24%, transparent 65%),
    linear-gradient(135deg, #000000, #260000, #000000);
}

#closeGallery {
  position: absolute;
  z-index: 10;
  top: 12px;
  left: 12px;
  padding: 12px 20px;
  background: transparent;
  border: 2px solid white;
  border-radius: 8px;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

#galleryMessage {
  position: absolute;
  z-index: 5;
  top: 50%;
  left: 0;
  width: 100%;
  color: white;
  pointer-events: none;
}

/* FLOATING LOCK BUTTON */
#lockButton {
  position: fixed;
  z-index: 100;
  right: 18px;
  bottom: 18px;
  padding: 15px 22px;
  background: #e00000;
  color: white;
  border: 2px solid white;
  border-radius: 12px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

#lockButton:disabled {
  opacity: 0.6;
}
</style>
</head>

<body>

<main id="home">
  <button id="picsButton" onclick="openGallery()">PICS</button>

  <h1>TAS LIVE</h1>

  <div id="status">CHECKING...</div>

  <p id="message">Checking TikTok status...</p>

  <p id="lastEnded"></p>

  <a id="watchButton"
     href="https://www.tiktok.com/@tasosanastasios"
     target="_blank"
     rel="noopener noreferrer">
    VISIT TAS CHANNEL
  </a>
</main>

<section id="gallery">
  <button id="closeGallery" onclick="closeGallery()">← BACK</button>
  <div id="photoGrid"></div>
  <p id="galleryMessage">Loading photos...</p>
</section>

<button id="lockButton" onclick="activateLock()">
  🔒 LOCK
</button>

<script>
const liveLink =
  "https://www.tiktok.com/@tasosanastasios/live";

const channelLink =
  "https://www.tiktok.com/@tasosanastasios";

let banReady = false;

/* CHECK VISITOR BAN STATUS */
async function checkBan() {
  try {
    const response = await fetch("/api/ban", {
      method: "GET",
      cache: "no-store",
      credentials: "same-origin"
    });

    if (!response.ok) {
      throw new Error("Could not check ban");
    }

    const data = await response.json();

    if (data.banned) {
      window.location.replace("/blocked.html");
      return false;
    }

    banReady = true;
    return true;

  } catch (error) {
    document.getElementById("lockButton").disabled = true;
    document.getElementById("message").textContent =
      "Could not verify website access. Please try again.";

    return false;
  }
}

/* ACTIVATE PERSONAL 45-MINUTE BAN */
async function activateLock() {
  if (!banReady) return;

  const button = document.getElementById("lockButton");
  button.disabled = true;

  try {
    const response = await fetch("/api/ban", {
      method: "POST",
      cache: "no-store",
      credentials: "same-origin"
    });

    if (!response.ok) {
      throw new Error("Ban failed");
    }

    window.location.replace("/blocked.html");

  } catch (error) {
    button.disabled = false;
    alert("Could not activate the ban. Please try again.");
  }
}

/* CHECK TIKTOK STATUS */
async function checkStatus() {
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const lastEnded = document.getElementById("lastEnded");
  const button = document.getElementById("watchButton");

  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error();

    const data = await response.json();

    if (data.live === true) {
      status.textContent = "● LIVE NOW";
      status.className = "live";
      message.textContent = "TAS IS LIVE ON TIKTOK!";
      button.textContent = "WATCH TAS LIVE";
      button.href = liveLink;
      lastEnded.textContent = "";

    } else {
      status.textContent = "● OFFLINE";
      status.className = "offline";
      message.textContent = "TAS IS NOT LIVE RIGHT NOW.";
      button.textContent = "VISIT TAS CHANNEL";
      button.href = channelLink;

      lastEnded.textContent = data.last_stream_ended
        ? "LAST STREAM ENDED: " +
          new Date(data.last_stream_ended).toLocaleString()
        : "LAST STREAM ENDED: NOT AVAILABLE YET";
    }

  } catch (error) {
    status.textContent = "STATUS UNAVAILABLE";
    status.className = "";
    message.textContent = "Could not check TikTok status.";
  }
}

/* OPEN GALLERY */
async function openGallery() {
  document.getElementById("home").style.display = "none";
  document.getElementById("gallery").style.display = "block";

  const grid = document.getElementById("photoGrid");
  const message = document.getElementById("galleryMessage");

  grid.innerHTML = "";
  message.textContent = "Loading photos...";

  try {
    const response = await fetch(
      "https://api.github.com/repos/alexanderGr48/-LIVE/contents/pics"
    );

    if (!response.ok) throw new Error();

    const files = await response.json();

    const photos = files
      .filter(file => /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name))
      .sort((a, b) => a.name.localeCompare(b.name))
      .slice(0, 2);

    if (photos.length === 0) {
      message.textContent = "No photos uploaded yet.";
    } else {
      photos.forEach(file => {
        const img = document.createElement("img");
        img.src = file.download_url;
        img.alt = "TAS photo";
        grid.appendChild(img);
      });

      message.textContent = "";
    }

    const redPanel = document.createElement("div");
    redPanel.className = "redPanel";
    grid.appendChild(redPanel);

  } catch (error) {
    message.textContent = "Could not load photos.";

    const redPanel = document.createElement("div");
    redPanel.className = "redPanel";
    grid.appendChild(redPanel);
  }
}

/* CLOSE GALLERY */
function closeGallery() {
  document.getElementById("gallery").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

/* START WEBSITE */
async function startWebsite() {
  const allowed = await checkBan();

  if (!allowed) return;

  checkStatus();
  setInterval(checkStatus, 300000);
}

startWebsite();
</script>

</body>
</html>
