
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

main {
  padding: 25px;
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#picsButton {
  display: inline-block;
  padding: 14px 35px;
  margin-bottom: 35px;
  border: 2px solid white;
  border-radius: 10px;
  background: transparent;
  color: white;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
}

h1 {
  font-size: clamp(55px, 12vw, 130px);
  letter-spacing: 8px;
  margin: 0 0 25px;
}

#status {
  font-size: clamp(32px, 7vw, 65px);
  font-weight: bold;
  margin: 25px 0;
}

#status.live {
  color: #20e879;
}

#status.offline {
  color: #ff4545;
}

p {
  color: #ccc;
  font-size: clamp(18px, 3vw, 26px);
}

a {
  display: inline-block;
  margin-top: 25px;
  padding: 24px 35px;
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(20px, 4vw, 36px);
  font-weight: bold;
  border-radius: 12px;
}

#gallery {
  display: none;
  width: 100%;
  padding: 25px;
}

#gallery h2 {
  font-size: 45px;
  margin: 15px 0 25px;
}

#photoGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  max-width: 1100px;
  margin: auto;
}

#photoGrid img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 10px;
}

#closeGallery {
  padding: 14px 30px;
  margin-bottom: 25px;
  border: 2px solid white;
  border-radius: 10px;
  background: transparent;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

#galleryMessage {
  color: #ccc;
  font-size: 20px;
}
</style>
</head>

<body>

<main id="home">

  <button id="picsButton" onclick="openGallery()">
    PICS
  </button>

  <h1>TAS LIVE</h1>

  <div id="status">CHECKING...</div>

  <p id="message">Checking TikTok status...</p>

  <p id="lastEnded"></p>

  <a id="watchButton"
     href="https://www.tiktok.com/@tasosanastasios">
    VISIT TAS CHANNEL
  </a>

</main>

<section id="gallery">

  <h2>PICS</h2>

  <button id="closeGallery" onclick="closeGallery()">
    ← BACK TO TAS LIVE
  </button>

  <div id="photoGrid"></div>

  <p id="galleryMessage">Loading photos...</p>

</section>

<script>
const liveLink =
  "https://www.tiktok.com/@tasosanastasios/live";

const channelLink =
  "https://www.tiktok.com/@tasosanastasios";

async function checkStatus() {
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const lastEnded = document.getElementById("lastEnded");
  const button = document.getElementById("watchButton");

  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("Status unavailable");

    const data = await response.json();

    if (data.live === true) {
      status.textContent = "● LIVE NOW";
      status.className = "live";
      message.textContent = "TAS IS LIVE ON TIKTOK!";
      button.textContent = "WATCH TAS LIVE";
      button.href = liveLink;
      lastEnded.textContent = "";
    } else {
      status.textContent = "● OFFLINE";
      status.className = "offline";
      message.textContent = "TAS IS NOT LIVE RIGHT NOW.";
      button.textContent = "VISIT TAS CHANNEL";
      button.href = channelLink;

      if (data.last_stream_ended) {
        lastEnded.textContent =
          "LAST STREAM ENDED: " +
          new Date(data.last_stream_ended).toLocaleString();
      } else {
        lastEnded.textContent =
          "LAST STREAM ENDED: NOT AVAILABLE YET";
      }
    }
  } catch (error) {
    status.textContent = "STATUS UNAVAILABLE";
    status.className = "";
    message.textContent = "Could not check TikTok status.";
  }
}

async function openGallery() {
  document.getElementById("home").style.display = "none";
  document.getElementById("gallery").style.display = "block";

  const grid = document.getElementById("photoGrid");
  const message = document.getElementById("galleryMessage");

  grid.innerHTML = "";
  message.textContent = "Loading photos...";

  try {
    const response = await fetch(
      "https://api.github.com/repos/alexanderGr48/-LIVE/contents/pics"
    );

    if (!response.ok) throw new Error("Could not load photos");

    const files = await response.json();

    const photos = files.filter(file =>
      /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
    );

    if (photos.length === 0) {
      message.textContent = "No photos uploaded yet.";
      return;
    }

    photos.forEach(file => {
      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = "TAS photo";
      img.loading = "lazy";
      grid.appendChild(img);
    });

    message.textContent = "";
  } catch (error) {
    message.textContent = "Could not load photos. Please try again.";
  }
}

function closeGallery() {
  document.getElementById("gallery").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

checkStatus();
setInterval(checkStatus, 300000);
</script>

</body>
</html>
