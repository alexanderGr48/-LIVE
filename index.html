
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  text-align: center;
}

header {
  padding: 55px 20px 25px;
}

h1 {
  font-size: clamp(42px, 10vw, 75px);
  font-weight: 900;
  letter-spacing: 7px;
  text-shadow: 0 0 25px #ff003c;
}

.subtitle {
  color: #888;
  margin-top: 12px;
  letter-spacing: 4px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin: 25px;
  padding: 10px 18px;
  border: 1px solid #333;
  border-radius: 30px;
  color: #aaa;
  font-size: 13px;
}

.dot {
  width: 9px;
  height: 9px;
  background: #777;
  border-radius: 50%;
}

.dot.live {
  background: #00e676;
  box-shadow: 0 0 12px #00e676;
}

nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 15px;
}

button, .tiktok {
  border: 1px solid #333;
  background: #111;
  color: white;
  padding: 16px 28px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 8px;
  transition: 0.2s;
  text-decoration: none;
}

button:hover, .tiktok:hover {
  border-color: #ff003c;
  color: #ff003c;
  transform: translateY(-3px);
}

#pics {
  display: none;
  max-width: 1100px;
  margin: 45px auto;
  padding: 20px;
}

#pics h2 {
  font-size: 30px;
  letter-spacing: 5px;
  margin-bottom: 25px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
}

.gallery img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #333;
}

#message {
  color: #888;
  margin: 20px;
}

.lock {
  margin-top: 55px;
  border-color: #ff003c;
  color: #ff003c;
}

footer {
  margin-top: 70px;
  padding: 25px;
  color: #555;
  font-size: 12px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<header>
  <h1>TAS LIVE</h1>
  <p class="subtitle">OFFICIAL WEBSITE</p>

  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">CHECKING STATUS...</span>
  </div>
</header>

<nav>
  <button onclick="showPics()">PICS</button>

  <a class="tiktok"
     href="https://www.tiktok.com/"
     target="_blank"
     rel="noopener noreferrer">
    TIKTOK
  </a>
</nav>

<section id="pics">
  <h2>PHOTO GALLERY</h2>
  <p id="message">Loading pictures...</p>
  <div class="gallery" id="gallery"></div>
</section>

<button class="lock" id="lockButton" onclick="lockSite()">
  🔒 LOCK
</button>

<footer>
  TAS LIVE © 2026
</footer>

<script>
const GITHUB_USER = "YOUR_GITHUB_USERNAME";
const GITHUB_REPO = "YOUR_REPOSITORY";
const GALLERY_FOLDER = "pics";

function showPics() {
  const section = document.getElementById("pics");

  section.style.display =
    section.style.display === "block" ? "none" : "block";

  if (section.style.display === "block") {
    loadGallery();
  }
}

async function loadGallery() {
  const gallery = document.getElementById("gallery");
  const message = document.getElementById("message");

  if (
    GITHUB_USER === "YOUR_GITHUB_USERNAME" ||
    GITHUB_REPO === "YOUR_REPOSITORY"
  ) {
    message.textContent =
      "Add your GitHub username and repository name in the code.";
    return;
  }

  message.textContent = "Loading pictures...";
  gallery.innerHTML = "";

  try {
    const url =
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GALLERY_FOLDER}`;

    const response = await fetch(url);

    if (!response.ok) throw new Error("Gallery unavailable");

    const files = await response.json();

    const images = files.filter(file =>
      /\.(png|jpe?g|gif|webp)$/i.test(file.name)
    );

    if (images.length === 0) {
      message.textContent = "No pictures found.";
      return;
    }

    message.textContent = "";

    images.forEach(file => {
      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = file.name;
      img.loading = "lazy";
      gallery.appendChild(img);
    });

  } catch (error) {
    message.textContent = "Could not load the gallery.";
  }
}

async function updateStatus() {
  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error();

    const data = await response.json();
    const live = data.live === true;

    document.getElementById("statusText").textContent =
      live ? "LIVE NOW" : "OFFLINE";

    document.getElementById("statusDot").classList.toggle(
      "live",
      live
    );

  } catch {
    document.getElementById("statusText").textContent =
      "STATUS UNAVAILABLE";
  }
}

async function lockSite() {
  const confirmed = confirm("Do you want to lock the site?");

  if (!confirmed) return;

  alert(
    "Locking requires a secure server-side admin system. " +
    "This button does not lock the website by itself."
  );
}

updateStatus();
setInterval(updateStatus, 30000);
</script>

</body>
</html>
