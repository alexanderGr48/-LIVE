
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

main {
  width: 100%;
  padding: 30px;
}

h1 {
  font-size: clamp(55px, 12vw, 130px);
  letter-spacing: 10px;
  margin: 0 0 25px;
}

p {
  font-size: clamp(20px, 3vw, 36px);
  color: #ddd;
}

a {
  display: inline-block;
  margin-top: 35px;
  padding: 24px 45px;
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(22px, 3vw, 36px);
  font-weight: bold;
  border-radius: 12px;
}

@media (max-height: 500px) {
  h1 { font-size: 55px; }
  a { margin-top: 10px; padding: 12px 25px; }
}
</style>
</head>

<body>
<main>
  <h1>TAS LIVE</h1>
  <p>OPENING TIKTOK LIVE...</p>

  <a href="https://www.tiktok.com/@tasosanastasios/live">
    WATCH TAS LIVE
  </a>
</main>

<script>
const liveURL = "https://www.tiktok.com/@tasosanastasios/live";

setTimeout(function() {
  window.location.href = liveURL;
}, 1200);
</script>

</body>
</html>
