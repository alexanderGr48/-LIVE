
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  letter-spacing: 3px;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 10px;
}

.player {
  width: 100%;
  max-width: 1200px;
  aspect-ratio: 16 / 9;
  background: #111;
}

iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

footer {
  padding: 12px;
  text-align: center;
  color: #888;
  font-size: 13px;
}

</style>
</head>

<body>

<header>TAS LIVE</header>

<main>
  <div class="player">
    <iframe
      src="https://player.livepush.io/live/emPuyGIc5s89OAgb"
      allowfullscreen
      allow="autoplay; fullscreen"
      title="TAS LIVE">
    </iframe>
  </div>
</main>

<footer>OFFICIAL TAS LIVE</footer>

</body>
</html>
