
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

/* MAIN SCREEN */
#home {
  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  padding: 12px 20px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#picsButton {
  margin-bottom: 35px;
  padding: 12px 38px;
  background: transparent;
  border: 2px solid white;
  color: white;
  border-radius: 10px;
  font-size: 25px;
  font-weight: bold;
  cursor: pointer;
}

h1 {
  font-size: clamp(55px, 12vw, 130px);
  letter-spacing: 8px;
  margin: 0 0 20px;
}

#status {
  font-size: clamp(32px, 7vw, 65px);
  font-weight: bold;
  margin: 20px 0;
}

.live {
  color: #20e879;
}

.offline {
  color: #ff4545;
}

p {
  color: #ccc;
  font-size: clamp(18px, 3vw, 26px);
}

a {
  display: inline-block;
  margin-top: 20px;
  padding: 22px 30px;
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(20px, 4vw, 36px);
  font-weight: bold;
  border-radius: 12px;
}

/* FIXED RED CIRCULAR LOCK BUTTON */
#lockButton {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 99999;

  width: 76px;
  height: 76px;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #ff2020;
  color: white;
  border: 2px solid white;
  border-radius: 50%;

  font-size: 15px;
  font-weight: bold;
  cursor: pointer;

  box-shadow: 0 0 16px rgba(255, 32, 32, 0.65);
  -webkit-appearance: none;
  appearance: none;
}

#lockButton:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* PICTURES SCREEN */
#gallery {
  display: none;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  position: relative;
  background: black;
}

/* THREE PICTURES SIDE BY SIDE */
#photoGrid {
  height: 100%;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: 1fr;
  gap: 0;
  padding: 0;
}

#photoGrid img {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  object-fit: contain;
  display: block;
  background: black;
}

/* BACK BUTTON */
#closeGallery {
  position: absolute;
  z-index: 2;
  top: 10px;
  left: 10px;
  padding: 10px 16px;
  background: rgba(0,0,0,.75);
  border: 1px solid white;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#galleryMessage {
  position: absolute;
  top: 50%;
  left: 0;
  width: 100%;
  color: white;
  pointer-events: none;
  font-size: 20px;
}

/* RESPONSIVE SCREENS */
@media (max-width: 600px) {
  #home {
    padding: 20px 14px 100px;
  }

  #picsButton {
    margin-bottom: 28px;
    padding: 11px 30px;
    font-size: 21px;
  }

  h1 {
    letter-spacing: 4px;
  }

  #status {
    margin: 16px 0;
  }

  a {
    padding: 20px 25px;
  }

  #lockButton {
    width: 68px;
    height: 68px;
    right: 14px;
    bottom: 14px;
  }
}

@media (max-width: 600px) and (orientation: portrait) {
  #photoGrid {
    grid-template-columns: 1fr;
    grid-template-rows: repeat(3, minmax(0, 1fr));
  }
}

@media (max-height: 500px) and (orientation: landscape) {
  #home {
    padding: 8px 15px 90px;
  }

  #picsButton {
    margin-bottom: 10px;
    padding: 7px 24px;
    font-size: 17px;
  }

  h1 {
    font-size: clamp(38px, 9vw, 70px);
    margin-bottom: 5px;
  }

  #status {
    font-size: clamp(25px, 5vw, 40px);
    margin: 8px 0;
  }

  p {
    margin: 7px 0;
    font-size: 17px;
  }

  a {
    margin-top: 8px;
    padding: 12px 24px;
    font-size: 21px;
  }
}
</style>
</head>

<body>

<main id="home">
  <button id="picsButton" onclick="openGallery()">PICS</button>

  <h1>TAS LIVE</h1>

  <div id="status">CHECKING...</div>

  <p id="message">Checking TikTok status...</p>

  <p id="lastEnded"></p>

  <a id="watchButton"
     href="https://www.tiktok.com/@tasosanastasios">
    VISIT TAS CHANNEL
  </a>
</main>

<section id="gallery">
  <button id="closeGallery" onclick="closeGallery()">← BACK</button>

  <div id="photoGrid"></div>

  <p id="galleryMessage">Loading photos...</p>
</section>

<!-- LOCK BUTTON STAYS VISIBLE ON EVERY SCREEN -->
<button id="lockButton" onclick="lockVisitor()" disabled>
  LOCK
</button>

<script>
const liveLink =
  "https://www.tiktok.com/@tasosanastasios/live";

const channelLink =
  "https://www.tiktok.com/@tasosanastasios";

const youtubeDestination =
  "https://youtube.com/shorts/Yt_F2odTgPA?si=d0U5hcmywHO6cpaO";

const photoFolder =
  "https://api.github.com/repos/alexanderGr48/-LIVE/contents/pics";

let banReady = false;

/* CHECK TIKTOK STATUS */
async function checkStatus() {
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const lastEnded = document.getElementById("lastEnded");
  const button = document.getElementById("watchButton");

  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("Status unavailable");

    const data = await response.json();

    const checkedAt = new Date(data.checked_at).getTime();

    const fresh =
      Number.isFinite(checkedAt) &&
      Date.now() - checkedAt < 15 * 60 * 1000 &&
      Date.now() >= checkedAt;

    if (!fresh) throw new Error("Old status");

    if (data.live === true) {
      status.textContent = "● LIVE NOW";
      status.className = "live";
      message.textContent = "TAS IS LIVE ON TIKTOK!";
      button.textContent = "WATCH TAS LIVE";
      button.href = liveLink;
      lastEnded.textContent = "";

    } else if (data.live === false) {
      status.textContent = "● OFFLINE";
      status.className = "offline";
      message.textContent = "TAS IS NOT LIVE RIGHT NOW.";
      button.textContent = "VISIT TAS CHANNEL";
      button.href = channelLink;

      lastEnded.textContent = data.last_stream_ended
        ? "LAST STREAM ENDED: " +
          new Date(data.last_stream_ended).toLocaleString()
        : "LAST STREAM ENDED: NOT AVAILABLE YET";

    } else {
      throw new Error("Could not verify status");
    }

  } catch (error) {
    status.textContent = "STATUS UNAVAILABLE";
    status.className = "";
    message.textContent = "Please try again shortly.";
    button.textContent = "VISIT TAS CHANNEL";
    button.href = channelLink;
    lastEnded.textContent = "";
  }
}

/* CHECK BAN */
async function checkBan() {
  const lockButton = document.getElementById("lockButton");

  try {
    const response = await fetch("/api/ban", {
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    const data = await response.json();

    if (data.banned) {
      window.location.replace(youtubeDestination);
      return;
    }

    banReady = true;
    lockButton.disabled = false;

  } catch (error) {
    banReady = false;
    lockButton.disabled = true;
  }
}

/* LOCK VISITOR FOR 45 MINUTES */
async function lockVisitor() {
  if (!banReady) return;

  const lockButton = document.getElementById("lockButton");
  lockButton.disabled = true;

  try {
    const response = await fetch("/api/ban", {
      method: "POST",
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    window.location.replace(youtubeDestination);

  } catch (error) {
    lockButton.disabled = false;
  }
}

/* OPEN PICTURE GALLERY */
async function openGallery() {
  document.getElementById("home").style.display = "none";
  document.getElementById("gallery").style.display = "block";

  const grid = document.getElementById("photoGrid");
  const message = document.getElementById("galleryMessage");

  grid.innerHTML = "";
  message.textContent = "Loading photos...";

  try {
    const response = await fetch(
      photoFolder + "?t=" + Date.now()
    );

    if (!response.ok) throw new Error();

    const files = await response.json();

    const photos = files
      .filter(file =>
        /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name))
      .slice(0, 3);

    if (photos.length === 0) {
      message.textContent = "No photos uploaded yet.";
      return;
    }

    photos.forEach(file => {
      const img = document.createElement("img");
      img.src = file.download_url;
      img.alt = "TAS photo";
      grid.appendChild(img);
    });

    message.textContent = "";

  } catch (error) {
    message.textContent = "Could not load photos.";
  }
}

/* CLOSE PICTURE GALLERY */
function closeGallery() {
  document.getElementById("gallery").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

checkStatus();
checkBan();

setInterval(checkStatus, 5000);
</script>

</body>
</html>
