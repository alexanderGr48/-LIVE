
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

main {
  padding: 25px;
  width: 100%;
}

h1 {
  font-size: clamp(55px, 12vw, 130px);
  letter-spacing: 8px;
  margin: 0 0 25px;
}

#status {
  font-size: clamp(32px, 7vw, 65px);
  font-weight: bold;
  margin: 25px 0;
}

#status.live { color: #20e879; }
#status.offline { color: #ff4545; }

p {
  color: #ccc;
  font-size: clamp(18px, 3vw, 22px);
}

a {
  display: inline-block;
  margin-top: 25px;
  padding: 24px 45px;
  background: #fe2c55;
  color: white;
  text-decoration: none;
  font-size: clamp(22px, 4vw, 36px);
  font-weight: bold;
  border-radius: 12px;
}

#lockButton {
  display: inline-block;
  margin-top: 18px;
  padding: 12px 30px;
  background: transparent;
  color: white;
  border: 2px solid white;
  border-radius: 10px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

#lockButton:disabled {
  opacity: 0.5;
}

@media (max-width: 480px) {
  h1 { letter-spacing: 4px; }
  main { padding: 20px; }
  a { padding: 20px 28px; }
}
</style>
</head>

<body>
<main>
  <h1>TAS LIVE</h1>

  <div id="status">CHECKING...</div>
  <p id="message">Checking TikTok LIVE status...</p>

  <a id="watchButton"
     href="https://www.tiktok.com/@tasosanastasios/live">
    WATCH TAS LIVE
  </a>

  <br>

  <button id="lockButton" onclick="lockVisitor()" disabled>
    LOCK
  </button>
</main>

<script>
const liveLink =
  "https://www.tiktok.com/@tasosanastasios/live";

const channelLink =
  "https://www.tiktok.com/@tasosanastasios";

const youtubeDestination =
  "https://youtube.com/shorts/Yt_F2odTgPA?si=d0U5hcmywHO6cpaO";

let banReady = false;

async function checkStatus() {
  const status = document.getElementById("status");
  const message = document.getElementById("message");
  const button = document.getElementById("watchButton");

  try {
    const response = await fetch(
      "/status.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error();

    const data = await response.json();

    const checkedAt = new Date(data.checked_at).getTime();
    const fresh =
      Number.isFinite(checkedAt) &&
      Date.now() - checkedAt < 15 * 60 * 1000 &&
      Date.now() >= checkedAt;

    if (!fresh) throw new Error("Status is old");

    if (data.live === true) {
      status.textContent = "● LIVE NOW";
      status.className = "live";
      message.textContent = "TAS is LIVE on TikTok!";
      button.textContent = "WATCH TAS LIVE";
      button.href = liveLink;

    } else if (data.live === false) {
      status.textContent = "● OFFLINE";
      status.className = "offline";
      message.textContent = "TAS is not live right now.";
      button.textContent = "VISIT TAS CHANNEL";
      button.href = channelLink;

    } else {
      throw new Error("Could not verify status");
    }

  } catch (error) {
    status.textContent = "STATUS UNAVAILABLE";
    status.className = "";
    message.textContent = "Please try again shortly.";
    button.textContent = "VISIT TAS CHANNEL";
    button.href = channelLink;
  }
}

async function checkBan() {
  const lockButton = document.getElementById("lockButton");

  try {
    const response = await fetch("/api/ban", {
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    const data = await response.json();

    if (data.banned) {
      window.location.replace(youtubeDestination);
      return;
    }

    banReady = true;
    lockButton.disabled = false;

  } catch (error) {
    banReady = false;
    lockButton.disabled = true;
  }
}

async function lockVisitor() {
  if (!banReady) return;

  const lockButton = document.getElementById("lockButton");
  lockButton.disabled = true;

  try {
    const response = await fetch("/api/ban", {
      method: "POST",
      cache: "no-store"
    });

    if (!response.ok) throw new Error();

    window.location.replace(youtubeDestination);

  } catch (error) {
    lockButton.disabled = false;
  }
}

checkStatus();
checkBan();

setInterval(checkStatus, 5000);
</script>
</body>
</html>
