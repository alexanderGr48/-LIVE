
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: clamp(48px, 10vw, 110px);
  margin: 0 0 20px;
  font-weight: 900;
}

#status {
  font-size: clamp(55px, 12vw, 130px);
  font-weight: 900;
  margin: 10px 0;
}

#message {
  font-size: 22px;
  margin: 10px;
}

#lastEnded {
  font-size: 15px;
  color: #aaa;
  margin: 8px;
}

.mainButton {
  display: inline-block;
  margin: 15px;
  padding: 18px 35px;
  background: white;
  color: black;
  text-decoration: none;
  border: 0;
  border-radius: 8px;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
}

#picsButton {
  transform: translateY(-50px);
}

#gallery {
  display: none;
  width: 100%;
  height: 100vh;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  background: black;
  position: relative;
}

.photoPanel {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

.photoPanel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#backButton {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 10;
  padding: 12px 22px;
  color: white;
  background: rgba(0,0,0,0.35);
  border: 2px solid white;
  border-radius: 5px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

#lockButton {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 20;
  width: 65px;
  height: 65px;
  border: none;
  border-radius: 50%;
  background: red;
  color: white;
  font-size: 27px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(255,0,0,0.5);
}

#lockButton:disabled {
  opacity: 0.5;
  cursor: wait;
}

#error {
  color: #ff5555;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="home">
  <h1>TAS LIVE</h1>

  <div id="status">LOADING</div>
  <div id="message">Checking TikTok LIVE status...</div>
  <div id="lastEnded"></div>
  <div id="error"></div>

  <a id="watchButton"
     class="mainButton"
     href="https://www.tiktok.com/@tasosanastasios"
     target="_blank"
     rel="noopener noreferrer">
    OPEN TIKTOK
  </a>

  <button id="picsButton" class="mainButton" onclick="openGallery()">
    PICS
  </button>
</div>

<div id="gallery">
  <button id="backButton" onclick="closeGallery()">BACK</button>

  <div class="photoPanel" id="photo1"></div>
  <div class="photoPanel" id="photo2"></div>
  <div class="photoPanel" id="photo3"></div>
</div>

<button id="lockButton" onclick="activateLock()" title="LOCK">
  LOCK
</button>

<script>
const YOUTUBE_DESTINATION =
  "https://youtube.com/shorts/Yt_F2odTgPA?si=d0U5hcmywHO6cpaO";

const GITHUB_PICS =
  "https://api.github.com/repos/alexanderGr48/-LIVE/contents/pics";

let banReady = false;

async function checkBan() {
  const button = document.getElementById("lockButton");

  try {
    const response = await fetch("/api/ban", {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Ban check failed");
    }

    const data = await response.json();

    if (data.banned) {
      window.location.replace(YOUTUBE_DESTINATION);
      return false;
    }

    banReady = true;
    button.disabled = false;
    return true;

  } catch (error) {
    document.getElementById("error").textContent =
      "Could not connect to the ban system.";

    button.disabled = true;
    return false;
  }
}

async function activateLock() {
  if (!banReady) return;

  const button = document.getElementById("lockButton");
  button.disabled = true;

  try {
    const response = await fetch("/api/ban", {
      method: "POST",
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Ban failed");
    }

    window.location.replace(YOUTUBE_DESTINATION);

  } catch (error) {
    button.disabled = false;
    document.getElementById("error").textContent =
      "Could not activate the ban. Please try again.";
  }
}

async function checkStatus() {
  try {
    const response = await fetch("/status.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("Status unavailable");

    const data = await response.json();

    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const lastEnded = document.getElementById("lastEnded");
    const watchButton = document.getElementById("watchButton");

    if (data.live === true) {
      status.textContent = "LIVE";
      status.style.color = "#00ff55";
      message.textContent = "TAS IS LIVE NOW";

      watchButton.textContent = "WATCH TAS LIVE";
      watchButton.href =
        "https://www.tiktok.com/@tasosanastasios/live";

    } else {
      status.textContent = "OFFLINE";
      status.style.color = "#ff3333";
      message.textContent = "TAS IS NOT LIVE";

      watchButton.textContent = "OPEN TIKTOK";
      watchButton.href =
        "https://www.tiktok.com/@tasosanastasios";
    }

    if (data.last_stream_ended) {
      const date = new Date(data.last_stream_ended);

      lastEnded.textContent =
        "Last stream ended: " + date.toLocaleString();
    } else {
      lastEnded.textContent = "";
    }

  } catch (error) {
    document.getElementById("message").textContent =
      "Could not load LIVE status.";
  }
}

async function openGallery() {
  document.getElementById("home").style.display = "none";
  document.getElementById("gallery").style.display = "grid";

  const panels = [
    document.getElementById("photo1"),
    document.getElementById("photo2"),
    document.getElementById("photo3")
  ];

  panels.forEach(panel => panel.innerHTML = "");

  try {
    const response = await fetch(GITHUB_PICS);

    if (!response.ok) {
      throw new Error("Could not load pictures");
    }

    const files = await response.json();

    const photos = files
      .filter(file =>
        file.type === "file" &&
        /\.(jpg|jpeg|png|gif|webp)$/i.test(file.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name))
      .slice(0, 3);

    photos.forEach((photo, index) => {
      const img = document.createElement("img");
      img.src = photo.download_url;
      img.alt = "TAS picture " + (index + 1);
      panels[index].appendChild(img);
    });

  } catch (error) {
    panels[0].textContent = "Could not load pictures";
  }
}

function closeGallery() {
  document.getElementById("gallery").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

async function startWebsite() {
  document.getElementById("lockButton").disabled = true;

  const allowed = await checkBan();

  if (!allowed) return;

  await checkStatus();

  setInterval(checkStatus, 5 * 60 * 1000);
}

startWebsite();
</script>

</body>
</html>
