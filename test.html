
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>TAS LIVE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 22px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 3px;
}

.status {
  color: #ff405e;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 2px;
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
}

h1 {
  font-size: clamp(34px, 7vw, 90px);
  line-height: 1.15;
  margin: 0 0 25px;
  font-weight: 900;
}

.subtitle {
  color: #888;
  font-size: clamp(14px, 2vw, 21px);
}

footer {
  padding: 20px;
  display: flex;
  justify-content: center;
}

button {
  background: #242424;
  border: 1px solid #555;
  border-radius: 12px;
  color: white;
  padding: 15px 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  background: #444;
}

@media (max-width: 600px) {
  header {
    padding: 18px;
  }
  .logo {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">TAS LIVE</div>
  <div class="status">● OFFLINE</div>
</header>

<main>
  <h1>Ο ΤΑΣ ΔΕΝ ΕΙΝΑΙ LIVE</h1>
  <div class="subtitle">
    Follow @tasosanastasios on TikTok
  </div>
</main>

<footer>
  <button id="fullscreen">
    ⛶ FULLSCREEN
  </button>
</footer>

<script>
document.getElementById("fullscreen")
.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    alert("Fullscreen is not supported by this browser.");
  }
});
</script>

</body>
</html>
